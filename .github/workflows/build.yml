name: Compilación y Empaquetado

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compilar:
    name: ${{ matrix.distro }}
    runs-on: ubuntu-latest
    container: ${{ matrix.imagen }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Debian 12
            imagen: debian:12
            sufijo: deb12
          - distro: Debian 13
            imagen: debian:13
            sufijo: deb13
          - distro: Arch Linux
            imagen: archlinux:latest
            sufijo: arch

    steps:
      - name: Instalar dependencias (Debian)
        if: startsWith(matrix.imagen, 'debian')
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential meson ninja-build cmake pkg-config gettext \
            dpkg-dev fakeroot \
            libglib2.0-dev-bin libgtk-3-dev libxfce4panel-2.0-dev \
            libxfconf-0-dev libxfce4ui-2-dev libnotify-dev libqrencode-dev

      - name: Instalar dependencias (Arch)
        if: startsWith(matrix.imagen, 'archlinux')
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel meson ninja cmake pkgconf gettext \
            gtk3 xfce4-panel xfconf libnotify qrencode

      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Compilar con meson
        run: |
          meson setup _meson src --prefix=/usr
          meson compile -C _meson 2>&1 | tee meson.log

      - name: Compilar con CMake
        run: |
          cmake -S src -B _cmake -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build _cmake 2>&1 | tee cmake.log

      - name: Empaquetar .deb (Debian)
        if: startsWith(matrix.imagen, 'debian')
        run: |
          PKG_NAME="xfce4-mi-plugin"
          PKG_VERSION="1.0.0"
          PKG_DESC="Plugin para el panel de XFCE4"
          ARCH=$(dpkg --print-architecture)
          OUT_DIR="${PKG_NAME}_${PKG_VERSION}-${{ matrix.sufijo }}_${ARCH}"

          # 1. Instalar archivos compilados por Meson en el directorio del paquete
          DESTDIR="$PWD/$OUT_DIR" meson install -C _meson

          # 2. Crear estructura DEBIAN y calcular dependencias automáticamente
          mkdir -p "$OUT_DIR/DEBIAN"
          
          cat <<EOF > "$OUT_DIR/DEBIAN/control"
          Package: $PKG_NAME
          Version: ${PKG_VERSION}~${{ matrix.sufijo }}
          Section: xfce
          Priority: optional
          Architecture: $ARCH
          Maintainer: Tu Nombre <tu@email.com>
          Depends: libgtk-3-0, libxfce4panel-2.0-4, libxfconf-0-3, libxfce4ui-2-0, libnotify4, libqrencode4
          Description: $PKG_DESC
          EOF

          # 3. Construir el paquete .deb
          dpkg-deb --build --root-owner-group "$OUT_DIR"

      - name: Subir paquete .deb a GitHub Actions
        if: startsWith(matrix.imagen, 'debian')
        uses: actions/upload-artifact@v4
        with:
          name: paquete-${{ matrix.sufijo }}
          path: "*.deb"

      - name: Resumen de avisos del compilador
        if: always()
        run: |
          n=$(cat meson.log cmake.log 2>/dev/null | grep -c "warning:" || true)
          echo "### ${{ matrix.distro }}: $n avisos del compilador" >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" -gt 0 ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat meson.log cmake.log | grep "warning:" | sort -u >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi