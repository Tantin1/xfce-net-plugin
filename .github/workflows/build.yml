name: Compilación y Empaquetado

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compilar:
    name: ${{ matrix.distro }}
    runs-on: ubuntu-latest
    container: ${{ matrix.imagen }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # editor: cómo se ofrece nm-connection-editor (botón Configuración
          # avanzada). En Debian 13 es un paquete propio y se recomienda (apt
          # lo instala por defecto). En Debian 12 viene dentro de
          # network-manager-gnome junto con nm-applet, que competiría con el
          # plugin (dos íconos, dos agentes de contraseñas): solo se sugiere
          # (no se instala por defecto). Sin él, el botón usa nmtui.
          - distro: Debian 12
            imagen: debian:12
            sufijo: deb12
            editor: "Suggests: network-manager-gnome"
          - distro: Debian 13
            imagen: debian:13
            sufijo: deb13
            editor: "Recommends: nm-connection-editor"
          - distro: Arch Linux
            imagen: archlinux:latest
            sufijo: arch

    steps:
      - name: Instalar dependencias (Debian)
        if: startsWith(matrix.imagen, 'debian')
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential meson ninja-build cmake pkg-config gettext \
            dpkg-dev fakeroot \
            libglib2.0-dev-bin libgtk-3-dev libxfce4panel-2.0-dev \
            libxfconf-0-dev libnotify-dev libqrencode-dev

      - name: Instalar dependencias (Arch)
        if: startsWith(matrix.imagen, 'archlinux')
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel meson ninja cmake pkgconf gettext \
            gtk3 xfce4-panel xfconf libnotify qrencode

      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Compilar con meson
        run: |
          meson setup _meson src --prefix=/usr
          meson compile -C _meson 2>&1 | tee meson.log

      - name: Compilar con CMake
        run: |
          cmake -S src -B _cmake -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build _cmake 2>&1 | tee cmake.log

      - name: Empaquetar .deb (Debian)
        if: startsWith(matrix.imagen, 'debian')
        run: |
          PKG_NAME="xfce-net-plugin"
          # La versión del proyecto se obtiene de la fuente única src/VERSION.
          # ~dev hace que el prerelease ordene antes de la versión estable en Debian.
          VERSION_BASE="$(head -n 1 src/VERSION)"
          case "$VERSION_BASE" in
            *-dev) PKG_VERSION="${VERSION_BASE%-dev}~dev" ;;
            *)     PKG_VERSION="$VERSION_BASE" ;;
          esac
          PKG_DESC="Manage Wi-Fi and Ethernet connections from the Xfce panel"
          ARCH=$(dpkg --print-architecture)
          DEB_NAME="${PKG_NAME}_${PKG_VERSION}-${{ matrix.sufijo }}_${ARCH}"
          # Carpeta del paquete donde las herramientas de Debian la esperan.
          OUT_DIR="debian/$PKG_NAME"

          # 1. Instalar archivos compilados por Meson en el directorio del paquete
          DESTDIR="$PWD/$OUT_DIR" meson install -C _meson
          mkdir -p "$OUT_DIR/DEBIAN"

          # 2. Bibliotecas: las calcula dpkg-shlibdeps a partir de con qué quedó
          #    enlazado el plugin, con el nombre correcto en cada versión de
          #    Debian (p. ej. libgtk-3-0t64 en Debian 13). Necesita un
          #    debian/control mínimo.
          printf 'Source: %s\n\nPackage: %s\nArchitecture: any\n' \
            "$PKG_NAME" "$PKG_NAME" > debian/control
          SO_FILE="$(find "$OUT_DIR" -name 'libxfce-net-plugin.so' | head -n 1)"
          SHLIBS="$(dpkg-shlibdeps -O "$SO_FILE" | sed -n 's/^shlibs:Depends=//p')"
          if [ -z "$SHLIBS" ]; then
            echo "No se pudieron calcular las dependencias de bibliotecas" >&2
            exit 1
          fi
          echo "Dependencias de bibliotecas: $SHLIBS"

          # 3. Metadatos del paquete. A mano solo va lo que no es biblioteca:
          #    network-manager (sin él el plugin no funciona) y el editor de
          #    conexiones (ver matrix.editor).
          cat <<EOF > "$OUT_DIR/DEBIAN/control"
          Package: $PKG_NAME
          Version: ${PKG_VERSION}~${{ matrix.sufijo }}
          Section: xfce
          Priority: optional
          Architecture: $ARCH
          Maintainer: Tantin1 <juanperez33840@gmail.com>
          Depends: $SHLIBS, network-manager
          ${{ matrix.editor }}
          Description: $PKG_DESC
           NetworkManager panel interface for Wi-Fi, Ethernet and VPN profiles.
           Provides connection details and an optional password agent.
          EOF

          # Información sobre copyright y licencia, dentro del paquete Debian.
          mkdir -p "$OUT_DIR/usr/share/doc/$PKG_NAME"
          cat <<EOF > "$OUT_DIR/usr/share/doc/$PKG_NAME/copyright"
          Format: https://www.debian.org/doc/packaging-manuals/copyright-format/1.0/
          Upstream-Name: xfce-net-plugin
          Source: https://github.com/Tantin1/xfce-net-plugin

          Files: *
          Copyright: 2026 Tantin1 <juanperez33840@gmail.com>
          License: GPL-2.0-or-later
           This program is free software: you can redistribute it and/or
           modify it under the terms of the GNU General Public License as
           published by the Free Software Foundation, either version 2
           of the License, or (at your option) any later version.
           .
           On Debian systems, the complete text of the GNU GPL version 2
           is available in /usr/share/common-licenses/GPL-2.

          Files: src/icons/nm-secure-lock.svg
          Copyright: Papirus Development Team and contributors
          License: GPL-3.0-only
           This icon is from the Papirus icon theme:
           https://github.com/PapirusDevelopmentTeam/papirus-icon-theme
           .
           On Debian systems, the complete text of the GNU GPL version 3
           is available in /usr/share/common-licenses/GPL-3.
          EOF

          # 4. Construir el paquete .deb
          dpkg-deb --build --root-owner-group "$OUT_DIR" "${DEB_NAME}.deb"

      - name: Subir paquete .deb a GitHub Actions
        if: startsWith(matrix.imagen, 'debian')
        uses: actions/upload-artifact@v4
        with:
          name: paquete-${{ matrix.sufijo }}
          path: "*.deb"

      - name: Resumen de avisos del compilador
        if: always()
        run: |
          n=$(cat meson.log cmake.log 2>/dev/null | grep -c "warning:" || true)
          echo "### ${{ matrix.distro }}: $n avisos del compilador" >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" -gt 0 ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat meson.log cmake.log | grep "warning:" | sort -u >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
